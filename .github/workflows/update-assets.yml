name: Update README assets

on:
  schedule:
    # Corre todos los días a las 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_assets.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar assets
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
          GH_LOGIN: InnoDev69
        run: python scripts/generate_assets.py

      - name: Commitear cambios si hay diferencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "chore: actualizar assets del README [skip ci]"
          git push
