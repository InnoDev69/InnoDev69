    .value { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6e6e6; }
    .accent { fill: #a41c1c; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="449" height="139" rx="10"/>
